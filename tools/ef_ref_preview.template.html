<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Эталон Epic Fight</title>
<style>
  html, body { margin: 0; background: #1b1a1f; overflow: hidden; font: 13px system-ui, sans-serif; color: #e9e6ee; }
  .lab { position: absolute; background: rgba(0,0,0,.45); padding: 2px 6px; border-radius: 3px; pointer-events: none; }
  .lab small { display: block; color: #b9b3c4; font-size: 11px; }
</style></head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Проигрыватель анимаций Epic Fight (biped armature) для изучения эталона — tools/ef_ref_render.py.
// Данные (иерархия, дорожки) подставляет скрипт из jar ВО ВРЕМЕННЫЙ файл; в репозитории — только этот код.
// Дорожки уже в осях превью (вперёд −z, вверх +y, вправо +x; поправка Blender → MC у первого элемента сделана в ef_ref.py).
// Поза: локальные матрицы = slerp(повороты) + lerp(переносы) по ключам; мир = произведение по иерархии; Coord — перенос сущности.
const REF = /*REF*/null;      // {joints: [{name, parent, bind: [16]}], anims: {name: {length, tracks: {joint: {t: [], q: [[w,x,y,z]], p: [[x,y,z]]}}}}}
const CELLS = /*CELLS*/null;  // {cols, cells: [{anim, t, yaw, pitch, dist, label, sub, scale, ty, follow}]}

function slerp(a, b, k) {
  let d = a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3];
  if (d < 0) { b = b.map(v => -v); d = -d; }
  if (d > 0.9995) { const q = a.map((v, i) => v + (b[i] - v) * k); const n = Math.hypot(...q); return q.map(v => v / n); }
  const th = Math.acos(d), s0 = Math.sin((1 - k) * th) / Math.sin(th), s1 = Math.sin(k * th) / Math.sin(th);
  return a.map((v, i) => v * s0 + b[i] * s1);
}
function sample(tr, t) {
  const ts = tr.t; let i = 0;
  if (t <= ts[0]) return [tr.q[0], tr.p[0]];
  if (t >= ts[ts.length - 1]) return [tr.q[ts.length - 1], tr.p[ts.length - 1]];
  while (ts[i + 1] < t) i++;
  const k = (t - ts[i]) / (ts[i + 1] - ts[i]);
  return [slerp(tr.q[i], tr.q[i + 1], k), tr.p[i].map((v, j) => v + (tr.p[i + 1][j] - v) * k)];
}
function matOf(q, p) {
  const m = new THREE.Matrix4();
  m.compose(new THREE.Vector3(...p), new THREE.Quaternion(q[1], q[2], q[3], q[0]), new THREE.Vector3(1, 1, 1));
  return m;
}
function worldPose(anim, t) {
  const W = {};
  let coord = new THREE.Vector3();
  if (anim.tracks.Coord) { const [, p] = sample(anim.tracks.Coord, t); coord.set(...p); }
  for (const j of REF.joints) {
    let L;
    const tr = anim.tracks[j.name];
    if (tr) { const [q, p] = sample(tr, t); L = matOf(q, p); } else L = new THREE.Matrix4().fromArray(j.bind).transpose();
    W[j.name] = j.parent ? W[j.parent].clone().multiply(L) : L.clone();
    if (!j.parent) { const e = W[j.name].elements; e[12] += coord.x; e[13] += coord.y; e[14] += coord.z; }
  }
  return W;
}

// ---------------------------------------------------------------- манекен: бруски по костям (пропорции biped MC), меч на Tool_R
const MAT = { skin: 0xc9b29a, cloth: 0x4a6aa8, clothL: 0x34507e, legR: 0x5a5f70, legL: 0x40444f, head: 0xd8c3a8, blade: 0xe6e9ef, hilt: 0x8a6a2a };
function box(w, h, d, color, y0, y1) {
  const g = new THREE.BoxGeometry(w, y1 - y0, d); g.translate(0, (y0 + y1) / 2, 0);
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color }));
}
const PARTS = [   // кость, ширина, глубина, от y, до y (в осях кости; вдоль кости — +y), цвет
  ['Torso', 0.5, 0.25, -0.02, 0.32, 'cloth'], ['Chest', 0.5, 0.25, 0.0, 0.4, 'cloth'], ['Head', 0.5, 0.5, 0.0, 0.5, 'head'],
  ['Arm_R', 0.24, 0.24, -0.06, 0.3, 'cloth'], ['Hand_R', 0.22, 0.22, 0.0, 0.32, 'skin'],
  ['Arm_L', 0.24, 0.24, -0.06, 0.3, 'clothL'], ['Hand_L', 0.22, 0.22, 0.0, 0.32, 'skin'],
  ['Thigh_R', 0.25, 0.25, 0.0, 0.38, 'legR'], ['Leg_R', 0.24, 0.24, 0.0, 0.375, 'legR'],
  ['Thigh_L', 0.25, 0.25, 0.0, 0.38, 'legL'], ['Leg_L', 0.24, 0.24, 0.0, 0.375, 'legL'],
];
function buildMannequin(blade) {
  const root = new THREE.Group(), parts = {};
  for (const [j, w, d, y0, y1, c] of PARTS) {
    const g = new THREE.Group(); g.matrixAutoUpdate = false; g.add(box(w, 0, d, MAT[c], y0, y1)); root.add(g); parts[j] = g;
  }
  const sw = new THREE.Group(); sw.matrixAutoUpdate = false;               // клинок вдоль −Z оси Tool_R (как проверено по уколам)
  const bl = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.16, blade), new THREE.MeshLambertMaterial({ color: MAT.blade })); bl.position.z = -blade / 2 - 0.12;
  const gd = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.36, 0.06), new THREE.MeshLambertMaterial({ color: MAT.hilt })); gd.position.z = -0.1;
  const hl = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.34), new THREE.MeshLambertMaterial({ color: MAT.hilt })); hl.position.z = 0.08;
  sw.add(bl, gd, hl); root.add(sw); parts.Tool_R = sw;
  return { root, parts };
}
function poseMannequin(man, W) {
  for (const j in man.parts) { if (W[j]) man.parts[j].matrix.copy(W[j]); man.parts[j].matrixWorldNeedsUpdate = true; }
}

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);

function scene() {
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0x1f1d24);
  sc.add(new THREE.HemisphereLight(0xffffff, 0x3a3634, 0.85));
  const d = new THREE.DirectionalLight(0xffffff, 0.7); d.position.set(3, 6, -4); sc.add(d);
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  for (let i = 0; i < 4; i++) for (let k = 0; k < 4; k++) { x.fillStyle = (i + k) % 2 ? '#2c2a30' : '#25232a'; x.fillRect(i * 16, k * 16, 16, 16); }
  const gt = new THREE.CanvasTexture(c); gt.magFilter = THREE.NearestFilter; gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(8, 8);
  const gr = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), new THREE.MeshLambertMaterial({ map: gt })); gr.rotation.x = -Math.PI / 2; sc.add(gr);
  return sc;
}
function camera(c, aspect, center) {
  const cam = new THREE.PerspectiveCamera(30, aspect, 0.05, 200);
  const h = 1.85, yaw = (c.yaw ?? 25) * Math.PI / 180, pitch = (c.pitch ?? 8) * Math.PI / 180, dist = (c.dist || 2.3) * h;
  const ty = c.ty ?? h * 0.48, cx = center ? center.x : 0, cz = center ? center.z : 0;
  cam.position.set(cx + Math.sin(yaw) * Math.cos(pitch) * dist, ty + Math.sin(pitch) * dist, cz - Math.cos(yaw) * Math.cos(pitch) * dist);
  cam.lookAt(cx, ty, cz);
  return cam;
}

const cols = CELLS.cols, rows = Math.ceil(CELLS.cells.length / cols);
const Wd = window.innerWidth, Hd = window.innerHeight, cw = Wd / cols, ch = Hd / rows;
CELLS.cells.forEach((c, i) => {
  const an = REF.anims[c.anim];
  const sc = scene(), man = buildMannequin(c.blade || 1.3);
  sc.add(man.root);
  const W = worldPose(an, c.t || 0);
  poseMannequin(man, W);
  let center = null;
  if (c.follow) { const e = W.Root.elements; center = { x: e[12] * (c.follow), z: e[14] * (c.follow) }; }
  const cam = camera(c, cw / ch, center);
  const x = (i % cols) * cw, y = Hd - (Math.floor(i / cols) + 1) * ch;
  renderer.setViewport(x, y, cw, ch); renderer.setScissor(x, y, cw, ch);
  renderer.render(sc, cam);
  if (c.label) {
    const d = document.createElement('div'); d.className = 'lab';
    d.style.left = (x + 8) + 'px'; d.style.top = (Math.floor(i / cols) * ch + 6) + 'px';
    d.innerHTML = c.label + (c.sub ? '<small>' + c.sub + '</small>' : ''); document.body.appendChild(d);
  }
});
window.READY = true;
</script>
</body></html>
