<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Эреб</title>
<style>
  :root { --bg: #0d0806; --fg: #f0e2d6; --muted: #a08c80; --panel: #1a0f0b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; left: 12px; top: 12px; z-index: 2; background: var(--panel); padding: 10px 12px; border-radius: 8px;
        border: 1px solid #3a2016; max-width: calc(100vw - 48px); }
  #ui select, #ui button, #ui input { background: #120a08; color: var(--fg); border: 1px solid #4a2a1c; border-radius: 4px; padding: 3px 6px; }
  #ui label { color: var(--muted); margin-right: 6px; }
  #ui .row { margin: 4px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  canvas { display: block; }
  .lab { position: fixed; z-index: 3; color: var(--fg); font: 600 15px system-ui, sans-serif; text-shadow: 0 0 4px #000, 0 0 2px #000; pointer-events: none; }
  .lab small { display: block; font-weight: 400; color: #d8c0b0; font-size: 12px; }
</style>
</head>
<body>
<div id="ui">
  <div class="row"><label>Модель</label><select id="model"></select><label>Анимация</label><select id="anim"></select>
    <button id="play">⏸</button><input id="time" type="range" min="0" max="1" step="0.001" value="0" style="width:160px"></div>
  <div class="row"><label><input type="checkbox" id="glow" checked> свечение</label><label><input type="checkbox" id="soul"> облик «души»</label>
    <span id="tinfo"></span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Превью «Эреба» (T30) рядом с эталоном — Главой Культа. Данные вставляет tools/gen_ereb_render.py (копия шаблона T26 + рапира).
const DATA = /*DATA*/null;      // { models: {name: {geo, tex, soul, glow, soulGlow, flame, scythe, height}}, anims: {name: anim} }
const CELLS = /*CELLS*/null;

// ------------------------------------------------------------------ .geo.json → three.js (как импорт Blockbench; box UV и per-face)
function facePoint(f, x0, y0, z0, x1, y1, z1, s, t) {
  switch (f) {
    case 'north': return [x1 + (x0 - x1) * s, y1 + (y0 - y1) * t, z0];
    case 'south': return [x0 + (x1 - x0) * s, y1 + (y0 - y1) * t, z1];
    case 'east':  return [x1, y1 + (y0 - y1) * t, z1 + (z0 - z1) * s];
    case 'west':  return [x0, y1 + (y0 - y1) * t, z0 + (z1 - z0) * s];
    case 'up':    return [x1 + (x0 - x1) * s, y1, z1 + (z0 - z1) * t];
    default:      return [x1 + (x0 - x1) * s, y0, z0 + (z1 - z0) * t];
  }
}
const NORM = { north: [0, 0, -1], south: [0, 0, 1], east: [1, 0, 0], west: [-1, 0, 0], up: [0, 1, 0], down: [0, -1, 0] };
function boxFaces(c) {
  const [u, v] = c.uv, [w, h, d] = c.size.map(x => Math.floor(x + 1e-6) || x);
  const f = {
    east:  { uv: [u, v + d], uv_size: [d, h] },
    north: { uv: [u + d, v + d], uv_size: [w, h] },
    west:  { uv: [u + d + w, v + d], uv_size: [d, h] },
    south: { uv: [u + 2 * d + w, v + d], uv_size: [w, h] },
    up:    { uv: [u + d + w, v + d], uv_size: [-w, -d] },
    down:  { uv: [u + d + 2 * w, v], uv_size: [-w, d] },
  };
  if (c.mirror) { const e = f.east; f.east = f.west; f.west = e; for (const k in f) { f[k].uv = [f[k].uv[0] + f[k].uv_size[0], f[k].uv[1]]; f[k].uv_size = [-f[k].uv_size[0], f[k].uv_size[1]]; } }
  return f;
}

const TEXC = {};
function loadTex(src, smooth) {
  const key = src + (smooth ? '#s' : '');
  if (TEXC[key]) return TEXC[key];
  const t = TEXC[key] = new THREE.TextureLoader().load(src);
  t.magFilter = smooth ? THREE.LinearFilter : THREE.NearestFilter; t.minFilter = smooth ? THREE.LinearFilter : THREE.NearestFilter; t.generateMipmaps = false;
  return t;
}

function buildModel(entry, soul) {
  const g = entry.geo['minecraft:geometry'][0];
  const TW = g.description.texture_width, TH = g.description.texture_height;
  const map = loadTex(soul && entry.soul ? entry.soul : (entry.texOverride || entry.tex));
  const mat = new THREE.MeshLambertMaterial({ map, alphaTest: 0.1, side: THREE.DoubleSide });
  let gmat = null;
  const glowSrc = soul && entry.soulGlow ? entry.soulGlow : entry.glow;
  if (glowSrc) gmat = new THREE.MeshBasicMaterial({ map: loadTex(glowSrc), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
                                                    side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1 });
  const bones = {}, root = new THREE.Group();
  for (const b of g.bones) {
    const grp = new THREE.Group();
    grp.name = b.name;
    const piv = [-b.pivot[0], b.pivot[1], b.pivot[2]];
    const r = b.rotation || [0, 0, 0];
    grp.userData = { piv, rest: [-r[0], -r[1], r[2]].map(v => v * Math.PI / 180), parent: b.parent };
    bones[b.name] = grp;
    for (const c of (b.cubes || [])) {
      if (Array.isArray(c.uv) === false && Object.keys(c.uv || {}).length === 0) continue;   // пустые armorBiped* (uv: {})
      if (c.size[0] * c.size[1] * c.size[2] === 0 && !Array.isArray(c.uv) && c.uv.north && c.uv.north.uv_size[0] === 0) continue;
      const faces = Array.isArray(c.uv) ? boxFaces(c) : c.uv;
      const inf = c.inflate || 0;
      const x0 = -(c.origin[0] + c.size[0]) - inf, x1 = -c.origin[0] + inf;
      const y0 = c.origin[1] - inf, y1 = c.origin[1] + c.size[1] + inf;
      const z0 = c.origin[2] - inf, z1 = c.origin[2] + c.size[2] + inf;
      const cp = c.pivot ? [-c.pivot[0], c.pivot[1], c.pivot[2]] : piv;
      const pos = [], uv = [], nrm = [], idx = [];
      for (const f in faces) {
        const U = faces[f].uv, S = faces[f].uv_size, base = pos.length / 3;
        if (!U || !S) continue;
        for (const [s, t] of [[0, 0], [1, 0], [1, 1], [0, 1]]) {
          const p = facePoint(f, x0, y0, z0, x1, y1, z1, s, t);
          pos.push(p[0] - cp[0], p[1] - cp[1], p[2] - cp[2]);
          uv.push((U[0] + s * S[0]) / TW, 1 - (U[1] + t * S[1]) / TH);
          nrm.push(...NORM[f]);
        }
        idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
      geom.setIndex(idx);
      const holder = new THREE.Group();
      holder.position.set(cp[0] - piv[0], cp[1] - piv[1], cp[2] - piv[2]);
      if (c.rotation) holder.rotation.set(-c.rotation[0] * Math.PI / 180, -c.rotation[1] * Math.PI / 180, c.rotation[2] * Math.PI / 180, 'ZYX');
      holder.add(new THREE.Mesh(geom, mat));
      if (gmat) { const gm = new THREE.Mesh(geom, gmat); gm.renderOrder = 2; gm.userData.glow = true; holder.add(gm); }
      grp.add(holder);
    }
  }
  for (const n in bones) {
    const grp = bones[n], par = grp.userData.parent ? bones[grp.userData.parent] : null;
    const pp = par ? par.userData.piv : [0, 0, 0];
    grp.userData.base = [grp.userData.piv[0] - pp[0], grp.userData.piv[1] - pp[1], grp.userData.piv[2] - pp[2]];
    (par || root).add(grp);
  }
  // огненный слой головы (FireBossFlameLayer: два скрещённых квадрата на голове, полная яркость; в облике души — нет)
  if (entry.flame && !soul && bones.head) {
    const ft = loadTex(entry.flame); ft.repeat.set(1, 1 / 8); ft.offset.set(0, 7 / 8);
    const fm = new THREE.MeshBasicMaterial({ map: ft, transparent: true, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending });
    const fg = new THREE.Group(); fg.userData.flame = ft; fg.userData.glow = true;
    for (const a of [45, 135]) { const q = new THREE.Mesh(new THREE.PlaneGeometry(11.3, 16), fm); q.position.y = 8 + 26 - bones.head.userData.piv[1]; q.rotation.y = a * Math.PI / 180; fg.add(q); }
    fg.position.set(0, 0, 0); bones.head.add(fg);
  }
  // коса Главы Культа (условный силуэт) — как в превью T26
  if (entry.scythe && bones.bipedHandRight) {
    const sg = new THREE.Group(), wood = new THREE.MeshLambertMaterial({ color: 0x2a1a14 }), iron = new THREE.MeshLambertMaterial({ color: 0x55504e });
    const shaft = new THREE.Mesh(new THREE.BoxGeometry(1.2, 40, 1.2), wood); shaft.position.y = 6; sg.add(shaft);
    const blade = new THREE.Mesh(new THREE.BoxGeometry(1, 3, 22), iron); blade.position.set(0, 25, -9); blade.rotation.x = -0.25; sg.add(blade);
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.4, 8), iron); tip.position.set(0, 22.5, -21); tip.rotation.x = -0.9; sg.add(tip);
    sg.rotation.x = Math.PI / 2; sg.position.z = -2;
    bones.bipedHandRight.add(sg);
  }
  // предмет из models/item/*.json (рапира): бруски с поворотом вокруг origin; хват — как ванильный handheld в руке
  if (entry.item && bones.bipedHandRight) bones.bipedHandRight.add(buildItem(entry.item));
  return { root, bones };
}


function buildItem(it) {
  // it: {els: [[from, to, color, rot]], display: {rotation, translation, scale}, fix: [x, y, z] (°), off: [x, y, z]}
  const inner = new THREE.Group();
  for (const [a, b, col, rot] of it.els) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(0.02, b[0] - a[0]), Math.max(0.02, b[1] - a[1]), Math.max(0.02, b[2] - a[2])),
                             new THREE.MeshLambertMaterial({ color: col }));
    const c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2];
    if (rot) {
      const o = rot.origin, p = new THREE.Group(); p.position.set(o[0] - 8, o[1] - 8, o[2] - 8);
      p.rotation[rot.axis] = rot.angle * Math.PI / 180; m.position.set(c[0] - o[0], c[1] - o[1], c[2] - o[2]); p.add(m); inner.add(p);
    } else { m.position.set(c[0] - 8, c[1] - 8, c[2] - 8); inner.add(m); }
  }
  // display (как ItemTransform: translate → rotate XYZ → scale), единицы — пиксели модели
  const d = it.display, disp = new THREE.Group();
  disp.position.set(d.translation[0], d.translation[1], d.translation[2]);
  disp.rotation.set(d.rotation[0] * Math.PI / 180, d.rotation[1] * Math.PI / 180, d.rotation[2] * Math.PI / 180, 'XYZ');
  disp.scale.set(d.scale[0], d.scale[1], d.scale[2]);
  disp.add(inner);
  const hold = new THREE.Group(); const f = it.fix || [0, 0, 0], off = it.off || [0, 0, 0];
  hold.rotation.set(f[0] * Math.PI / 180, f[1] * Math.PI / 180, f[2] * Math.PI / 180, 'XYZ'); hold.position.set(off[0], off[1], off[2]);
  hold.add(disp); hold.userData.item = true;
  return hold;
}

// ------------------------------------------------------------------ анимации GeckoLib (vector + easing на ключе-приёмнике)
const EASE = {
  linear: t => t, step: t => (t < 1 ? 0 : 1),
  easeInSine: t => 1 - Math.cos(t * Math.PI / 2), easeOutSine: t => Math.sin(t * Math.PI / 2), easeInOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  easeInQuad: t => t * t, easeOutQuad: t => 1 - (1 - t) * (1 - t), easeInOutQuad: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  easeInCubic: t => t * t * t, easeOutCubic: t => 1 - Math.pow(1 - t, 3), easeInOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  easeInQuart: t => t ** 4, easeOutQuart: t => 1 - Math.pow(1 - t, 4), easeInOutQuart: t => t < 0.5 ? 8 * t ** 4 : 1 - Math.pow(-2 * t + 2, 4) / 2,
  easeInOutQuint: t => t < 0.5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2,
  easeInOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  easeInElastic: t => t === 0 ? 0 : t === 1 ? 1 : -Math.pow(2, 10 * t - 10) * Math.sin((t * 10 - 10.75) * (2 * Math.PI) / 3),
  easeOutElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1,
  easeInOutElastic: t => t === 0 ? 0 : t === 1 ? 1 : t < 0.5 ? -(Math.pow(2, 20 * t - 10) * Math.sin((20 * t - 11.125) * (2 * Math.PI) / 4.5)) / 2
                                                           : (Math.pow(2, -20 * t + 10) * Math.sin((20 * t - 11.125) * (2 * Math.PI) / 4.5)) / 2 + 1,
};
function chanAt(chan, t, def) {
  const ts = Object.keys(chan).map(Number).sort((a, b) => a - b);
  const get = k => { const v = chan[Object.keys(chan).find(x => Number(x) === k)]; return Array.isArray(v) ? { v } : { v: v.vector || v.post || v.pre, e: v.easing }; };
  if (!ts.length) return def;
  if (t <= ts[0]) return get(ts[0]).v;
  if (t >= ts[ts.length - 1]) return get(ts[ts.length - 1]).v;
  let i = 0; while (ts[i + 1] < t) i++;
  const a = ts[i], b = ts[i + 1], A = get(a), B = get(b);
  const k = (EASE[B.e] || EASE.linear)((t - a) / (b - a));
  return A.v.map((x, j) => x + (B.v[j] - x) * k);
}
function pose(model, anim, t) {
  for (const n in model.bones) {
    const g = model.bones[n], u = g.userData;
    let r = [0, 0, 0], p = [0, 0, 0], s = [1, 1, 1];
    const bk = anim && anim.bones[n];
    if (bk) {
      if (bk.rotation) r = Array.isArray(bk.rotation) ? bk.rotation : chanAt(bk.rotation.vector ? { 0: bk.rotation } : bk.rotation, t, r);
      if (bk.position) p = Array.isArray(bk.position) ? bk.position : chanAt(bk.position.vector ? { 0: bk.position } : bk.position, t, p);
      if (bk.scale) { s = Array.isArray(bk.scale) ? bk.scale : chanAt(bk.scale.vector ? { 0: bk.scale } : bk.scale, t, s); if (!Array.isArray(s)) s = [s, s, s]; }
    }
    g.position.set(u.base[0] - p[0], u.base[1] + p[1], u.base[2] + p[2]);
    g.rotation.set(u.rest[0] - r[0] * Math.PI / 180, u.rest[1] - r[1] * Math.PI / 180, u.rest[2] + r[2] * Math.PI / 180, 'ZYX');
    g.scale.set(Math.max(1e-4, s[0]), Math.max(1e-4, s[1]), Math.max(1e-4, s[2]));
  }
}
function flameFrame(model, tick) { model.root.traverse(o => { if (o.userData.flame) o.userData.flame.offset.y = 1 - ((Math.floor(tick / 2) % 8) + 1) / 8; }); }


// ------------------------------------------------------------------ условные эффекты для кадров (спрайты-маски из textures/sigil, тонированные)
// fx: [{tex, n, at: [x, y, z] (блоки, оси взгляда модели: x — вправо, y — вверх, z — вперёд), spread: [sx, sy, sz], size: [от, до],
//       color, op, add (аддитивно), seed, ground (плоскость на земле, size — радиус), spin}]
function rnd(seed) { let x = seed * 9301 + 49297; return () => { x = (x * 9301 + 49297) % 233280; return x / 233280; }; }
function addFx(scene, list) {
  for (const f of (list || [])) {
    const tex = loadTex(DATA.tex[f.tex], true);
    const mat = new THREE.MeshBasicMaterial({ map: tex, color: new THREE.Color(f.color || '#ffffff'), transparent: true, depthWrite: false,
      opacity: f.op ?? 1, blending: f.add === false ? THREE.NormalBlending : THREE.AdditiveBlending, side: THREE.DoubleSide });
    const R = rnd(f.seed || 7), n = f.n || 1, sp = f.spread || [0, 0, 0];
    for (let i = 0; i < n; i++) {
      const sz = (f.size ? f.size[0] + (f.size[1] - f.size[0]) * R() : 1) * 16;
      const m = new THREE.Mesh(new THREE.PlaneGeometry(sz, sz), mat);
      const x = (f.at[0] + (R() * 2 - 1) * sp[0]) * 16, y = (f.at[1] + (R() * 2 - 1) * sp[1]) * 16, z = -(f.at[2] + (R() * 2 - 1) * sp[2]) * 16;
      m.position.set(x, y, z);
      if (f.ground) { m.rotation.x = -Math.PI / 2; m.position.y = 0.2 + i * 0.05; }
      else { m.userData.bill = true; m.userData.spin = (R() * 2 - 1) * (f.spin ?? 0.6); }
      m.renderOrder = 5; scene.add(m);
    }
  }
}
function billboard(scene, cam) { scene.traverse(o => { if (o.userData.bill) { o.quaternion.copy(cam.quaternion); o.rotateZ(o.userData.spin); } }); }

// ------------------------------------------------------------------ сцена
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);

function groundTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { x.fillStyle = (i + j) % 2 ? (NEUTRAL ? '#4a4c50' : '#3a2e28') : (NEUTRAL ? '#42444a' : '#342822'); x.fillRect(i * 16, j * 16, 16, 16); }
  const gt = new THREE.CanvasTexture(c); gt.magFilter = THREE.NearestFilter; gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(32, 32);
  return gt;
}
let NEUTRAL = false;
function makeScene(c) {
  NEUTRAL = !!c.neutral;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(c.bg || (c.neutral ? 0x23262c : 0x1c1210));
  scene.fog = new THREE.Fog(scene.background, 200, 700);
  if (c.neutral) {   // дневной свет (белый), как в мире днём: для сравнения цветов со скином владельца
    scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, (c.dim ?? 1) * 0.85));
    const d = new THREE.DirectionalLight(0xffffff, (c.dim ?? 1) * 0.6); d.position.set(30, 60, -40); scene.add(d);
  } else {
  scene.add(new THREE.HemisphereLight(0xd8c8c0, 0x281410, (c.dim ?? 1) * 0.8));
  const d = new THREE.DirectionalLight(0xfff0e0, (c.dim ?? 1) * 0.7); d.position.set(30, 60, -40); scene.add(d);
  const d2 = new THREE.DirectionalLight(0xff8040, (c.dim ?? 1) * 0.35); d2.position.set(-40, 20, 50); scene.add(d2);
  }
  if (c.ground !== false) {
    const gr = new THREE.Mesh(new THREE.PlaneGeometry(512, 512), new THREE.MeshLambertMaterial({ map: groundTex() }));
    gr.rotation.x = -Math.PI / 2; gr.position.y = -0.01; scene.add(gr);
  }
  return scene;
}
function cameraFor(entry, view) {
  const h = entry.height || 34;
  const cam = new THREE.PerspectiveCamera(view.fov || 30, 1, 0.5, 3000);
  const yaw = (view.yaw ?? 25) * Math.PI / 180, pitch = (view.pitch ?? 8) * Math.PI / 180;
  const dist = (view.dist || 2.3) * h * (30 / (view.fov || 30));
  const ty = view.ty ?? h * 0.55;
  cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, ty + Math.sin(pitch) * dist, -Math.cos(yaw) * Math.cos(pitch) * dist);
  cam.lookAt(0, ty, 0);
  return cam;
}

function setup(c) {
  const e = DATA.models[c.model];
  const m = buildModel(c.smile && e.smile ? Object.assign({}, e, { texOverride: e.smile }) : e, c.soul);
  if (c.item === false) m.root.traverse(o => { if (o.userData.item) o.visible = false; });
  if (c.x) m.root.position.x = c.x;
  if (c.hide) m.root.traverse(o => { if (o.isMesh) o.visible = false; });
  const anim = c.anim ? DATA.anims[c.anim] : null;
  pose(m, anim, c.t || 0); flameFrame(m, Math.floor((c.t || 0) * 20));
  if (c.noGlow) m.root.traverse(o => { if (o.userData.glow) o.visible = false; });
  return { e, m };
}

if (CELLS) {
  const cols = CELLS.cols, rows = Math.ceil(CELLS.cells.length / cols);
  const W = window.innerWidth, H = window.innerHeight, cw = W / cols, ch = H / rows;
  const draw = () => {
    CELLS.cells.forEach((c, i) => {
      const { e, m } = setup(c);
      const sc = makeScene(c); sc.add(m.root);
      for (const w of (c.with || [])) { const r = setup(Object.assign({}, w)); r.m.root.position.x = w.x || 0; r.m.root.position.z = w.z || 0;
        r.m.root.rotation.y = (w.ry || 0) * Math.PI / 180; sc.add(r.m.root); }
      if (c.mry) m.root.rotation.y = c.mry * Math.PI / 180;
      if (c.light) { const p = new THREE.PointLight(0xff7a30, c.light, 120, 2); p.position.set(0, 30, -20); sc.add(p); }
      const cam = cameraFor(c.h ? { height: c.h } : e, c); cam.aspect = cw / ch; cam.updateProjectionMatrix();
      addFx(sc, c.fx); billboard(sc, cam);
      const x = (i % cols) * cw, y = H - (Math.floor(i / cols) + 1) * ch;
      renderer.setViewport(x, y, cw, ch); renderer.setScissor(x, y, cw, ch);
      renderer.render(sc, cam);
      if (c.label) {
        const d = document.createElement('div'); d.className = 'lab';
        d.style.left = (x + 8) + 'px'; d.style.top = (Math.floor(i / cols) * ch + 6) + 'px';
        d.innerHTML = c.label + (c.sub ? '<small>' + c.sub + '</small>' : ''); document.body.appendChild(d);
      }
    });
    document.getElementById('ui').style.display = 'none';
    window.READY = true;
  };
  THREE.DefaultLoadingManager.onLoad = () => { if (!window.READY) setTimeout(draw, 50); };
  for (const c of CELLS.cells) { setup(c); for (const w of (c.with || [])) setup(w); for (const f of (c.fx || [])) loadTex(DATA.tex[f.tex], true); }
} else {
  const sel = document.getElementById('model'), asel = document.getElementById('anim');
  for (const n in DATA.models) sel.add(new Option(DATA.models[n].title || n, n));
  asel.add(new Option('(покой)', ''));
  for (const a of Object.keys(DATA.anims).sort()) asel.add(new Option(a, a));
  let cur, scene, anim, t0 = performance.now(), playing = true, yaw = 25, pitch = 8, zoom = 1, tfix = 0;
  const setModel = () => {
    scene = makeScene({});
    cur = buildModel(DATA.models[sel.value], document.getElementById('soul').checked); scene.add(cur.root);
    setAnim();
  };
  const setAnim = () => { anim = asel.value ? DATA.anims[asel.value] : null; t0 = performance.now(); };
  sel.onchange = setModel; asel.onchange = setAnim; document.getElementById('soul').onchange = setModel;
  document.getElementById('glow').onchange = e => cur.root.traverse(o => { if (o.userData.glow) o.visible = e.target.checked; });
  document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? '⏸' : '▶'; t0 = performance.now() - tfix * 1000; };
  document.getElementById('time').oninput = e => { playing = false; document.getElementById('play').textContent = '▶'; tfix = e.target.value * (anim ? anim.animation_length : 1); };
  let drag = null;
  renderer.domElement.onpointerdown = e => drag = [e.clientX, e.clientY, yaw, pitch];
  window.onpointerup = () => drag = null;
  window.onpointermove = e => { if (drag) { yaw = drag[2] - (e.clientX - drag[0]) * 0.4; pitch = Math.max(-30, Math.min(80, drag[3] + (e.clientY - drag[1]) * 0.3)); } };
  renderer.domElement.onwheel = e => { zoom *= Math.exp(e.deltaY * 0.001); e.preventDefault(); };
  window.onresize = () => renderer.setSize(window.innerWidth, window.innerHeight);
  setModel();
  const loop = () => {
    const W = window.innerWidth, H = window.innerHeight;
    renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H);
    let t = tfix;
    if (anim && playing) {
      const L = anim.animation_length, el = (performance.now() - t0) / 1000;
      t = anim.loop === true ? el % L : Math.min(el % (L + 1.0), L);
      tfix = t; document.getElementById('time').value = t / L;
    }
    if (cur) { pose(cur, anim, t); flameFrame(cur, Math.floor(performance.now() / 50)); }
    document.getElementById('tinfo').textContent = anim ? t.toFixed(2) + ' / ' + anim.animation_length + ' с' : '';
    const cam = cameraFor(DATA.models[sel.value], { yaw, pitch, dist: 2.3 * zoom }); cam.aspect = W / H; cam.updateProjectionMatrix();
    renderer.render(scene, cam);
    requestAnimationFrame(loop);
  };
  loop();
}
</script>
</body>
