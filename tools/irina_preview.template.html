<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ирина, Ведьма Ревности</title>
<style>
  :root { --bg: #0e0a14; --fg: #efe6f6; --muted: #a596b8; --panel: #1a1324; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; left: 12px; top: 12px; z-index: 2; background: var(--panel); padding: 10px 12px; border-radius: 8px;
        border: 1px solid #3a2a4c; max-width: calc(100vw - 48px); }
  #ui select, #ui button, #ui input { background: #120c1a; color: var(--fg); border: 1px solid #4a3462; border-radius: 4px; padding: 3px 6px; }
  #ui label { color: var(--muted); margin-right: 6px; }
  #ui .row { margin: 4px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  canvas { display: block; }
  .lab { position: fixed; z-index: 3; color: var(--fg); font: 600 15px system-ui, sans-serif; text-shadow: 0 0 4px #000, 0 0 2px #000; pointer-events: none; }
  .lab small { display: block; font-weight: 400; color: #d8c8e8; font-size: 12px; }
</style>
</head>
<body>
<div id="ui">
  <div class="row"><label>Тело</label><select id="anim"></select><label>Ткань</label><select id="cloth"></select>
    <button id="play">⏸</button><input id="time" type="range" min="0" max="1" step="0.001" value="0" style="width:160px"></div>
  <div class="row"><label><input type="checkbox" id="glow" checked> свечение</label><label><input type="checkbox" id="staff" checked> посох</label>
    <span id="tinfo"></span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Превью «Ирины, Ведьмы Ревности» (T27). Данные вставляет tools/irina_render.py.
const DATA = /*DATA*/null;      // { geo, tex, glow, anims, staff: {els, display}, height }
const CELLS = /*CELLS*/null;

function facePoint(f, x0, y0, z0, x1, y1, z1, s, t) {
  switch (f) {
    case 'north': return [x1 + (x0 - x1) * s, y1 + (y0 - y1) * t, z0];
    case 'south': return [x0 + (x1 - x0) * s, y1 + (y0 - y1) * t, z1];
    case 'east':  return [x1, y1 + (y0 - y1) * t, z1 + (z0 - z1) * s];
    case 'west':  return [x0, y1 + (y0 - y1) * t, z0 + (z1 - z0) * s];
    case 'up':    return [x1 + (x0 - x1) * s, y1, z1 + (z0 - z1) * t];
    default:      return [x1 + (x0 - x1) * s, y0, z0 + (z1 - z0) * t];
  }
}
const NORM = { north: [0, 0, -1], south: [0, 0, 1], east: [1, 0, 0], west: [-1, 0, 0], up: [0, 1, 0], down: [0, -1, 0] };
const TEXC = {};
function loadTex(src) {
  if (TEXC[src]) return TEXC[src];
  const t = TEXC[src] = new THREE.TextureLoader().load(src);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  return t;
}
function boxFaces(c) {
  const [u, v] = c.uv, [w, h, d] = c.size.map(x => Math.floor(x + 1e-6) || x);
  return { east: { uv: [u, v + d], uv_size: [d, h] }, north: { uv: [u + d, v + d], uv_size: [w, h] }, west: { uv: [u + d + w, v + d], uv_size: [d, h] },
           south: { uv: [u + 2 * d + w, v + d], uv_size: [w, h] }, up: { uv: [u + d + w, v + d], uv_size: [-w, -d] }, down: { uv: [u + d + 2 * w, v], uv_size: [-w, d] } };
}
function buildModel(E) {
  E = E || DATA;
  const g = E.geo['minecraft:geometry'][0];
  const TW = g.description.texture_width, TH = g.description.texture_height;
  const mat = new THREE.MeshLambertMaterial({ map: loadTex(E.tex), alphaTest: 0.5, side: THREE.DoubleSide });
  const gmat = E.glow ? new THREE.MeshBasicMaterial({ map: loadTex(E.glow), transparent: true, blending: THREE.AdditiveBlending,
                                                         depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1 }) : null;
  const bones = {}, root = new THREE.Group();
  for (const b of g.bones) {
    const grp = new THREE.Group(); grp.name = b.name;
    const piv = [-b.pivot[0], b.pivot[1], b.pivot[2]];
    const r = b.rotation || [0, 0, 0];
    grp.userData = { piv, rest: [-r[0], -r[1], r[2]].map(v => v * Math.PI / 180), parent: b.parent };
    bones[b.name] = grp;
    for (const c of (b.cubes || [])) {
      if (!Array.isArray(c.uv) && Object.keys(c.uv || {}).length === 0) continue;
      if (c.size[0] * c.size[1] * c.size[2] === 0 && !Array.isArray(c.uv)) continue;
      const faces = Array.isArray(c.uv) ? boxFaces(c) : c.uv, inf = c.inflate || 0;
      const x0 = -(c.origin[0] + c.size[0]) - inf, x1 = -c.origin[0] + inf;
      const y0 = c.origin[1] - inf, y1 = c.origin[1] + c.size[1] + inf;
      const z0 = c.origin[2] - inf, z1 = c.origin[2] + c.size[2] + inf;
      const cp = c.pivot ? [-c.pivot[0], c.pivot[1], c.pivot[2]] : piv;
      const pos = [], uv = [], nrm = [], idx = [];
      for (const f in faces) {
        const U = faces[f].uv, S = faces[f].uv_size, base = pos.length / 3;
        if (!U || !S) continue;
        for (const [s, t] of [[0, 0], [1, 0], [1, 1], [0, 1]]) {
          const p = facePoint(f, x0, y0, z0, x1, y1, z1, s, t);
          pos.push(p[0] - cp[0], p[1] - cp[1], p[2] - cp[2]);
          uv.push((U[0] + s * S[0]) / TW, 1 - (U[1] + t * S[1]) / TH);
          nrm.push(...NORM[f]);
        }
        idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
      geom.setIndex(idx);
      const holder = new THREE.Group();
      holder.position.set(cp[0] - piv[0], cp[1] - piv[1], cp[2] - piv[2]);
      if (c.rotation) holder.rotation.set(-c.rotation[0] * Math.PI / 180, -c.rotation[1] * Math.PI / 180, c.rotation[2] * Math.PI / 180, 'ZYX');
      holder.add(new THREE.Mesh(geom, mat));
      if (gmat) { const gm = new THREE.Mesh(geom, gmat); gm.renderOrder = 2; gm.userData.glow = true; holder.add(gm); }
      grp.add(holder);
    }
  }
  for (const n in bones) {
    const grp = bones[n], par = grp.userData.parent ? bones[grp.userData.parent] : null;
    const pp = par ? par.userData.piv : [0, 0, 0];
    grp.userData.base = [grp.userData.piv[0] - pp[0], grp.userData.piv[1] - pp[1], grp.userData.piv[2] - pp[2]];
    (par || root).add(grp);
  }
  return { root, bones };
}

// ------------------------------------------------------------------ посох (models/item/irina_staff.json) и хват как у Iron's
function itemMesh() {
  const grp = new THREE.Group();
  for (const [a, b, rot, fc] of DATA.staff.els) {
    const mats = ['east', 'west', 'up', 'down', 'south', 'north'].map(f => new THREE.MeshLambertMaterial({ color: fc[f] }));
    const m = new THREE.Mesh(new THREE.BoxGeometry(b[0] - a[0] || 0.01, b[1] - a[1] || 0.01, b[2] - a[2] || 0.01), mats);
    const c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2];
    if (rot) {
      const p = new THREE.Group(); p.position.set(rot.origin[0] - 8, rot.origin[1] - 8, rot.origin[2] - 8);
      p.rotation[rot.axis] = rot.angle * Math.PI / 180;
      m.position.set(c[0] - rot.origin[0], c[1] - rot.origin[1], c[2] - rot.origin[2]); p.add(m); grp.add(p);
    } else { m.position.set(c[0] - 8, c[1] - 8, c[2] - 8); grp.add(m); }
  }
  return grp;
}
function attachStaff(model, ctx) {
  const hand = model.bones.bipedHandRight; if (!hand) return;
  const d = DATA.staff.display[ctx || 'thirdperson_righthand'];
  const a = new THREE.Group(); a.position.set(0, -1, -1);                       // Iron's: translate(0, −1/16, −1/16)
  const b = new THREE.Group(); b.rotation.x = -Math.PI / 2; a.add(b);            // Iron's: X −90
  const t = new THREE.Group(); t.position.set(...(d.translation || [0, 0, 0])); b.add(t);
  const r = new THREE.Group(); const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(...(d.rotation || [0, 0, 0]).map(v => v * Math.PI / 180), 'XYZ'));
  r.quaternion.copy(q); t.add(r);
  const s = new THREE.Group(); s.scale.set(...(d.scale || [1, 1, 1])); r.add(s);
  const it = itemMesh(); s.add(it);
  a.userData.staff = true; hand.add(a);
}

// ------------------------------------------------------------------ анимации (контроллер тела + контроллер ткани)
const SORTED = new WeakMap();      // ключи по времени: Object.keys ставит целые ("0", "1", "2") вперёд остальных — без сортировки
function chanAt(chan, t, def) {     // кадр между 0 и 1 с интерполировался бы от 0 прямо к 1 (проверка 20.11)
  if (Array.isArray(chan)) return chan;
  let ks = SORTED.get(chan);
  if (!ks) { ks = Object.keys(chan).sort((a, b) => Number(a) - Number(b)); SORTED.set(chan, ks); }
  const ts = ks.map(Number);
  if (!ts.length) return def;
  const get = i => { const v = chan[ks[i]]; return Array.isArray(v) ? v : (v.vector || v.post || v.pre); };
  if (t <= ts[0]) return get(0);
  if (t >= ts[ts.length - 1]) return get(ts.length - 1);
  let i = 0; while (ts[i + 1] < t) i++;
  const A = get(i), B = get(i + 1), k = (t - ts[i]) / (ts[i + 1] - ts[i]);
  return A.map((x, j) => x + (B[j] - x) * k);
}
function animTime(anim, t) { if (!anim) return 0; const L = anim.animation_length; return anim.loop === true ? t % L : Math.min(t, L); }
function pose(model, anim, cloth, t, tc) {
  for (const n in model.bones) {
    const g = model.bones[n], u = g.userData;
    let r = [0, 0, 0], p = [0, 0, 0], s = [1, 1, 1];
    for (const [an, tt] of [[anim, animTime(anim, t)], [cloth, animTime(cloth, tc ?? t)]]) {
      const bk = an && an.bones[n];
      if (!bk) continue;
      if (bk.rotation) r = chanAt(bk.rotation, tt, r);
      if (bk.position) p = chanAt(bk.position, tt, p);
      if (bk.scale) { s = chanAt(bk.scale, tt, s); if (!Array.isArray(s)) s = [s, s, s]; }
    }
    g.position.set(u.base[0] - p[0], u.base[1] + p[1], u.base[2] + p[2]);
    g.rotation.set(u.rest[0] - r[0] * Math.PI / 180, u.rest[1] - r[1] * Math.PI / 180, u.rest[2] + r[2] * Math.PI / 180, 'ZYX');
    g.scale.set(Math.max(1e-4, s[0]), Math.max(1e-4, s[1]), Math.max(1e-4, s[2]));
  }
}

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
function groundTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { x.fillStyle = (i + j) % 2 ? '#2e2a36' : '#282430'; x.fillRect(i * 16, j * 16, 16, 16); }
  const gt = new THREE.CanvasTexture(c); gt.magFilter = THREE.NearestFilter; gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(32, 32);
  return gt;
}
function makeScene(c) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(c.bg || 0x15101c);
  scene.add(new THREE.HemisphereLight(0xeee6ff, 0x2a1830, (c.dim ?? 1) * 0.85));
  const d = new THREE.DirectionalLight(0xfff4ea, (c.dim ?? 1) * 0.6); d.position.set(30, 60, -40); scene.add(d);
  const d2 = new THREE.DirectionalLight(0xff4050, (c.dim ?? 1) * 0.25); d2.position.set(-40, 20, 50); scene.add(d2);
  if (c.ground !== false) {
    const gr = new THREE.Mesh(new THREE.PlaneGeometry(512, 512), new THREE.MeshLambertMaterial({ map: groundTex() }));
    gr.rotation.x = -Math.PI / 2; gr.position.y = -0.01; scene.add(gr);
  }
  return scene;
}
function cameraFor(view) {
  const h = DATA.height || 52;
  const cam = new THREE.PerspectiveCamera(view.fov || 30, 1, 0.5, 3000);
  const yaw = (view.yaw ?? 25) * Math.PI / 180, pitch = (view.pitch ?? 8) * Math.PI / 180;
  const dist = (view.dist || 2.0) * h * (30 / (view.fov || 30));
  const ty = view.ty ?? h * 0.5;
  cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, ty + Math.sin(pitch) * dist, -Math.cos(yaw) * Math.cos(pitch) * dist);
  cam.lookAt(view.tx || 0, ty, view.tz || 0);
  return cam;
}
function setup(c) {
  if (c.staffOnly) {
    const root = new THREE.Group(); const it = itemMesh(); it.scale.set(1, 1, 1); root.add(it); it.position.y = 8;
    it.rotation.y = (c.spin || 0) * Math.PI / 180;
    return { root };
  }
  const m = buildModel();
  if (c.staff !== false) attachStaff(m);
  if (c.arrow) {                                   // стрелка «вперёд» (по взгляду модели, −z) на земле — для проверочных кадров
    const mat = new THREE.MeshBasicMaterial({ color: 0x3cff6a, side: THREE.DoubleSide });
    const sh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.4, 30), mat); sh.position.set(0, 0.3, -24); m.root.add(sh);
    const hd = new THREE.Mesh(new THREE.ConeGeometry(4, 9, 4), mat); hd.rotation.x = -Math.PI / 2; hd.position.set(0, 0.3, -43); m.root.add(hd);
  }
  pose(m, c.anim ? DATA.anims[c.anim] : null, c.cloth ? DATA.anims[c.cloth] : DATA.anims.irina_cloth_idle, c.t || 0, c.tc);
  if (c.noGlow) m.root.traverse(o => { if (o.userData.glow) o.visible = false; });
  if (c.noThreads && m.bones.threads) m.bones.threads.visible = false;      // проверочные кадры: нити не заслоняют руки и посох
  if (c.compare && DATA.cl) {                     // рядом — Глава Культа (эталон), тот же масштаб и свет
    const cl = buildModel(DATA.cl); pose(cl, null, null, 0);
    const both = new THREE.Group(); m.root.position.x = -c.compare; cl.root.position.x = c.compare; both.add(m.root); both.add(cl.root);
    return { root: both };
  }
  return m;
}
if (CELLS) {
  const cols = CELLS.cols, rows = Math.ceil(CELLS.cells.length / cols);
  const W = window.innerWidth, H = window.innerHeight, cw = W / cols, ch = H / rows;
  const draw = () => {
    CELLS.cells.forEach((c, i) => {
      const m = setup(c);
      const sc = makeScene(c); sc.add(m.root);
      if (c.light) { const p = new THREE.PointLight(0xff3040, c.light, 120, 2); p.position.set(0, 30, -20); sc.add(p); }
      const cam = cameraFor(c); cam.aspect = cw / ch; cam.updateProjectionMatrix();
      const x = (i % cols) * cw, y = H - (Math.floor(i / cols) + 1) * ch;
      renderer.setViewport(x, y, cw, ch); renderer.setScissor(x, y, cw, ch);
      renderer.render(sc, cam);
      if (c.label) {
        const d = document.createElement('div'); d.className = 'lab';
        d.style.left = (x + 8) + 'px'; d.style.top = (Math.floor(i / cols) * ch + 6) + 'px';
        d.innerHTML = c.label + (c.sub ? '<small>' + c.sub + '</small>' : ''); document.body.appendChild(d);
      }
    });
    document.getElementById('ui').style.display = 'none';
    window.READY = true;
  };
  THREE.DefaultLoadingManager.onLoad = () => { if (!window.READY) setTimeout(draw, 50); };
  for (const c of CELLS.cells) setup(c);
  setTimeout(() => { if (!window.READY) draw(); }, 4000);      // посох без текстур — onLoad не придёт
} else {
  const asel = document.getElementById('anim'), csel = document.getElementById('cloth');
  asel.add(new Option('(покой)', ''));
  for (const a of Object.keys(DATA.anims).sort()) (a.startsWith('irina_cloth') ? csel : asel).add(new Option(a, a));
  csel.value = 'irina_cloth_idle';
  let cur, scene, t0 = performance.now(), playing = true, yaw = 25, pitch = 8, zoom = 1, tfix = 0;
  scene = makeScene({}); cur = buildModel(); attachStaff(cur); scene.add(cur.root);
  const A = () => asel.value ? DATA.anims[asel.value] : null, C = () => DATA.anims[csel.value];
  asel.onchange = () => { t0 = performance.now(); }; csel.onchange = () => { t0 = performance.now(); };
  document.getElementById('glow').onchange = e => cur.root.traverse(o => { if (o.userData.glow) o.visible = e.target.checked; });
  document.getElementById('staff').onchange = e => cur.root.traverse(o => { if (o.userData.staff) o.visible = e.target.checked; });
  document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? '⏸' : '▶'; t0 = performance.now() - tfix * 1000; };
  document.getElementById('time').oninput = e => { playing = false; document.getElementById('play').textContent = '▶'; tfix = e.target.value * (A() ? A().animation_length : 4); };
  let drag = null;
  renderer.domElement.onpointerdown = e => drag = [e.clientX, e.clientY, yaw, pitch];
  window.onpointerup = () => drag = null;
  window.onpointermove = e => { if (drag) { yaw = drag[2] - (e.clientX - drag[0]) * 0.4; pitch = Math.max(-30, Math.min(80, drag[3] + (e.clientY - drag[1]) * 0.3)); } };
  renderer.domElement.onwheel = e => { zoom *= Math.exp(e.deltaY * 0.001); e.preventDefault(); };
  window.onresize = () => renderer.setSize(window.innerWidth, window.innerHeight);
  const loop = () => {
    const W = window.innerWidth, H = window.innerHeight;
    renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H);
    let t = tfix;
    if (playing) { const L = A() ? A().animation_length + (A().loop === true ? 0 : 1) : 1e9; t = ((performance.now() - t0) / 1000) % L; tfix = t; }
    pose(cur, A(), C(), t, (performance.now() - t0) / 1000);
    document.getElementById('tinfo').textContent = A() ? t.toFixed(2) + ' / ' + A().animation_length + ' с' : '';
    const cam = cameraFor({ yaw, pitch, dist: 2.0 * zoom }); cam.aspect = W / H; cam.updateProjectionMatrix();
    renderer.render(scene, cam);
    requestAnimationFrame(loop);
  };
  loop();
}
</script>
</body>
</html>
